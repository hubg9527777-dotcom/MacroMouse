name: Build MacroMouse
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            label: macOS
          - arch: x86_64
            label: Intel
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'
      - name: Swift version
        run: swift --version
      - name: Build & Package (${{ matrix.label }})
        run: |
          chmod +x build.sh
          ./build.sh ${{ matrix.arch }}
      - name: Dynamic Rename with Version
        shell: bash
        env:
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
          BUILD_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_REF_TYPE" == "tag" ]]; then
            if [[ ! "$RELEASE_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
              echo "拒绝不符合版本格式的发布标签"
              exit 1
            fi
            VERSION="$RELEASE_REF_NAME"
          else
            VERSION="dev"
          fi

          if [[ "$BUILD_ARCH" == "arm64" ]]; then
            NEW_NAME="MacroMouse-macOS-${VERSION}.zip"
            mv dist/MacroMouse-macOS.zip "dist/${NEW_NAME}"
          else
            NEW_NAME="Mouse-intel-${VERSION}.zip"
            mv dist/MacroMouse-Intel.zip "dist/${NEW_NAME}"
          fi

          printf 'ZIP_NAME=%s\n' "$NEW_NAME" >> "$GITHUB_ENV"
      - name: Debug - list dist contents
        run: |
          echo "==== dist 目录内容 ===="
          ls -laR dist/ || echo "dist 目录不存在"
      - name: Upload artifact (${{ matrix.label }})
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: dist/${{ env.ZIP_NAME }}
          retention-days: 7

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: macos-15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download architecture packages
        uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'dist/**/*.zip'
      - name: Upload to Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/**/*.zip
