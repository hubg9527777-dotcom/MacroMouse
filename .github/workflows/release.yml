name: Release MacroMouse with provenance

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to rebuild, attest, and upload'
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-attest-release:
    name: Build, attest, and publish macOS release
    runs-on: macos-15
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

    steps:
      - name: Validate release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "release_tag 必须是 vMAJOR.MINOR.PATCH 格式的版本标签"
            exit 1
          fi

      - name: Check out immutable release source
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.release_tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Build universal application package
        shell: bash
        run: |
          set -euo pipefail
          chmod +x build.sh
          ./build.sh universal
          test -f dist/MacroMouse-macOS.zip

      - name: Validate final payload and create checksum
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          APP="dist/MacroMouse.app"
          ZIP="dist/MacroMouse-macOS.zip"

          plutil -lint "$APP/Contents/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")" = "$VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Contents/Info.plist")" = "6"
          ARCHES="$(lipo -archs "$APP/Contents/MacOS/MacroMouse")"
          [[ " $ARCHES " == *" arm64 "* ]]
          [[ " $ARCHES " == *" x86_64 "* ]]
          codesign --verify --deep --strict --verbose=2 "$APP"
          shasum -a 256 "$ZIP" | tee "$ZIP.sha256"

      # The attested subject is the same exact ZIP replaced in the Release step below.
      - name: Generate provenance for final Release ZIP
        uses: actions/attest@v4
        with:
          subject-path: dist/MacroMouse-macOS.zip

      - name: Upsert final Release assets without deleting the existing Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              dist/MacroMouse-macOS.zip \
              dist/MacroMouse-macOS.zip.sha256 \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$RELEASE_TAG" \
              dist/MacroMouse-macOS.zip \
              dist/MacroMouse-macOS.zip.sha256 \
              --repo "$GITHUB_REPOSITORY" \
              --title "MacroMouse ${RELEASE_TAG#v}" \
              --generate-notes \
              --verify-tag
          fi
